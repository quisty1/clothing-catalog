x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://catalog:${POSTGRES_PASSWORD:?Run scripts/init_env.py}@postgres:5432/catalog
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: catalog
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:59000:9000"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    deploy: {replicas: 2}
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    deploy: {replicas: 2}
    init: true
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    volumes: [./infra/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, --url, http://gateway:8080]
    depends_on: [gateway]
    restart: unless-stopped
  prepare-tests:
    <<: *backend
    profiles: [test]
    command: [python, -m, app.prepare_tests]
    depends_on:
      postgres: {condition: service_healthy}
  tests:
    <<: *backend
    profiles: [test]
    deploy: {replicas: 1}
    environment:
      DATABASE_URL: postgresql+psycopg://catalog:${POSTGRES_PASSWORD}@postgres:5432/catalog
      TEST_DATABASE_URL: postgresql+psycopg://catalog:${POSTGRES_PASSWORD}@postgres:5432/catalog_test
      TEST_MINIO_ENDPOINT: minio:9000
      RUN_INTEGRATION: "1"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    command: [pytest, -q, -p, no:cacheprovider]
    depends_on:
      prepare-tests: {condition: service_completed_successfully}
      minio: {condition: service_healthy}

volumes:
  postgres-data:
  minio-data:
