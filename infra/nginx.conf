events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api_pool { zone api_pool 64k; server api:8000 resolve; }
  upstream web_pool { zone web_pool 64k; server web:3000 resolve; }
  server {
    listen 8080;
    client_max_body_size 1m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 55s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ { proxy_pass http://api_pool; proxy_set_header Host $host; }
    location = /telegram/webhook { proxy_pass http://api_pool; proxy_set_header Host $host; }
    location /telegram/ { return 404; }
    location / { proxy_pass http://web_pool; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
